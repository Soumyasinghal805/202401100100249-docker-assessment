services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-db

  backend:
    image: soumya0812/fest-backend:1.0.0
    environment:
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REGNO: "202401100100249"
      APP_VERSION: 1.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "129:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-backend

networks:
  frontend-backend:
  backend-db:
    internal: true

volumes:
  db-data:

